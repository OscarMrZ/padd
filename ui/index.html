<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e1424">
  <title>PADD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600&family=Barlow:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/ui/app.js"></script>
</head>
<body>
  <div class="frame">
    <div class="elbow" aria-hidden="true"></div>

    <header class="bar">
      <span class="mark">PADD</span>
      <button class="place" aria-haspopup="dialog" aria-expanded="false" aria-controls="nav">
        <span class="project">Choose a project</span>
        <span class="sub"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="status" aria-haspopup="dialog" aria-expanded="false" aria-controls="session" aria-live="polite"></button>
      <button class="talk" aria-label="Messages" aria-expanded="false" aria-controls="talk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18l-1.5 3.5L8 19.5h9a3 3 0 0 0 3-3v-8a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v8c0 .5.3 1 1 1.5z"/></svg>
        <span class="badge" hidden></span>
      </button>
      <button class="send" aria-haspopup="dialog" aria-expanded="false" aria-controls="composer" disabled>Send to Claude</button>
    </header>

    <aside class="rail" aria-label="Tools">
      <div class="group" role="radiogroup" aria-label="Tool">
        <button class="tool" data-tool="pen" aria-label="Pen" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M4 20l1.5-5L16 4.5a2.1 2.1 0 0 1 3 3L8.5 18z"/><path d="M14 6.5l3 3"/></svg>
        </button>
        <button class="tool" data-tool="highlighter" aria-label="Highlighter" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M9 15l-3 3h4l1.5-1.5"/><path d="M9 15l7-10 3 3-10 7z"/><path d="M4 21h16"/></svg>
        </button>
        <button class="tool" data-tool="eraser" aria-label="Eraser" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.5 14.5l9-9a2 2 0 0 1 3 0l3 3a2 2 0 0 1 0 3L13 18H8z"/><path d="M9 10l6 6"/></svg>
        </button>
      </div>

      <div class="group swatches" role="radiogroup" aria-label="Colour"></div>

      <div class="group sizes" role="radiogroup" aria-label="Line width">
        <button class="size" data-size="2" aria-label="Fine"><i style="--d:4px"></i></button>
        <button class="size" data-size="4" aria-label="Medium"><i style="--d:8px"></i></button>
        <button class="size" data-size="8" aria-label="Bold"><i style="--d:13px"></i></button>
      </div>

      <div class="group end">
        <button class="act" data-act="undo" aria-label="Undo" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button class="act" data-act="fit" aria-label="Fit to screen" title="Fit to screen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </aside>

    <main class="work">
      <div class="stage">
        <canvas class="ink"></canvas>
        <canvas class="live"></canvas>
        <p class="empty" hidden></p>
      </div>

      <section class="strip" aria-label="Images" hidden>
        <div class="strip-info">
          <span class="board-title"></span>
          <span class="count"></span>
          <label class="follow">
            <input type="checkbox" checked>
            <span>Jump to new</span>
          </label>
        </div>
        <label class="add-image" title="Add a photo or an image">
          <input type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
          <span>Add image</span>
        </label>
        <div class="thumbs" role="listbox" aria-label="Images, newest first"></div>
      </section>
    </main>
  </div>

  <div class="nav" id="nav" role="dialog" aria-label="Projects" hidden></div>

  <div class="session-pop" id="session" role="dialog" aria-label="Claude session" hidden></div>

  <form class="composer" id="composer" role="dialog" aria-label="Send to Claude" hidden>
    <p class="who"></p>
    <textarea name="text" maxlength="4000" placeholder="Add a note (optional). Your marks go along with it."></textarea>
    <div class="actions">
      <button type="button" class="ghost" data-close="composer">Cancel</button>
      <button class="primary">Send to Claude</button>
    </div>
  </form>

  <aside class="talk-panel" id="talk" aria-label="Messages" hidden>
    <header>
      <h2>Messages</h2>
      <button class="ghost" data-close="talk" aria-label="Close messages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <ol class="messages"></ol>
  </aside>

  <button class="reply-card" hidden></button>
  <div class="toast" role="alert" hidden></div>
</body>
</html>
